name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm test

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build extension bundle
        run: npx esbuild src/index.ts --bundle --platform=node --target=node22 --outfile=dist/index.js --external:@mariozechner/pi-ai --external:@mariozechner/pi-tui --external:@mariozechner/pi-agent-core --external:@sinclair/typebox

      # Skip the install when tmux is already in the runner image
      # (ghcr.io/elecnix/actions-runner bakes it in; the stock
      # actions-runner image does not, hence the check).
      - name: Install tmux
        run: command -v tmux >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux; }

      - name: Run integration tests with tmux screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PI_OFFLINE: "1"
        run: |
          cd test/integration
          chmod +x ./run-screenshots.sh
          npx tsx run-screenshots.ts ./screenshots

      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmux-screenshots
          path: test/integration/screenshots/
          retention-days: 30

      - name: Create tmux screenshots check report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ github.workspace }}/test/integration/screenshots/screenshots-report-truncated.md';
            let report = '';
            let conclusion = 'success';
            try {
              report = fs.readFileSync(reportPath, 'utf8');
            } catch {
              report = '⚠️ No screenshot report found. The integration test may have failed before generating it.';
              conclusion = 'failure';
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Tmux Screenshots',
              head_sha: context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: 'Tmux Screenshots',
                summary: report,
              },
            });
